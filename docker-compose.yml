# Este arquivo docker compose configura todos os serviços que utilizo em produção no meu servidor pessoal
# 
# Informações úteis para administração dos containers:
# - Os containers estão dispostos em ordem alfabéticas neste arquivo
# - No início de cada serviço há um ou mais links para a documentação ou tutoriais de como configurar cada serviço

x-cloudflare-dns: &cloudflare-dns
  dns:
    - 1.1.1.1
    - 1.0.0.1

x-local-dns: &local-dns
  dns:
    - 172.16.0.2

x-timezone-env: &timezone-env
  TZ: ${TIMEZONE}

x-user-permissions: &user-permissions
  PUID: 1000
  PGID: 1000

x-restart: &restart
  restart: unless-stopped

x-docker-socket: &docker-socket
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

x-calibre-web-env: &calibre-web-env
  DOCKER_MODS: linuxserver/mods:universal-calibre #optional
  OAUTHLIB_RELAX_TOKEN_SCOPE: 1 #optional

x-duplicati-env: &duplicati-env
  DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI__WEBSERVICE_PASSWORD}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}

x-filebrowser-env: &filebrowser-env
  FB_ROOT: /data
  FB_NOAUTH: true

x-freshrss-env: &freshrss-env
  CRON_MIN: '2,32'
  FRESHRSS_INSTALL: |-
    --api-enabled
    --default-user hick
    --language pt-BR
  FRESHRSS_USER: |-
    --api-password ${FRESHRSS_PASSWORD}
    --email ${FRESHRSS_EMAIL}
    --language pt-BR
    --password ${FRESHRSS_PASSWORD}
    --user ${FRESHRSS_USER}

x-immich-env: &immich-env
  IMMICH_VERSION: release
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: immich
  POSTGRES_INITDB_ARGS: '--data-checksums'

x-jellyfin-env: &jellyfin-env
  JELLYFIN_PublishedServerUrl: http://server.local:8096

x-komodo-env: &komodo-env
  KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
  KOMODO_DATABASE_USERNAME: admin
  KOMODO_DATABASE_PASSWORD: admin
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: admin
  COMPOSE_KOMODO_IMAGE_TAG: 2
  COMPOSE_KOMODO_BACKUPS_PATH: /etc/komodo/backups
  KOMODO_HOST: https://example.komodo.com
  KOMODO_TITLE: Komodo
  KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
  KOMODO_LOCAL_AUTH: true
  KOMODO_INIT_ADMIN_USERNAME: admin
  KOMODO_INIT_ADMIN_PASSWORD: admin
  KOMODO_FIRST_SERVER_NAME: Local
  KOMODO_DISABLE_CONFIRM_DIALOG: false
  KOMODO_DISABLE_INIT_RESOURCES: false
  KOMODO_WEBHOOK_SECRET: a_random_secret
  KOMODO_JWT_SECRET: a_random_jwt_secret
  KOMODO_JWT_TTL: 1-day
  KOMODO_MONITORING_INTERVAL: 15-sec
  KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
  KOMODO_DISABLE_USER_REGISTRATION: false
  KOMODO_ENABLE_NEW_USERS: false
  KOMODO_DISABLE_NON_ADMIN_CREATE: false
  KOMODO_TRANSPARENT_MODE: false
  KOMODO_OIDC_ENABLED: false
  KOMODO_GITHUB_OAUTH_ENABLED: false
  KOMODO_GOOGLE_OAUTH_ENABLED: false
  KOMODO_LOGGING_PRETTY: false
  KOMODO_PRETTY_STARTUP_CONFIG: false
  PERIPHERY_CORE_ADDRESS: ws://komodo-core:9120
  PERIPHERY_CONNECT_AS: Local
  PERIPHERY_ROOT_DIRECTORY: /etc/komodo
  PERIPHERY_DISABLE_TERMINALS: false
  PERIPHERY_DISABLE_CONTAINER_TERMINALS: false
  PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
  PERIPHERY_LOGGING_PRETTY: false
  PERIPHERY_PRETTY_STARTUP_CONFIG: false

x-librespeed-env: &librespeed-env
  MODE: standalone
  # TITLE: "Teste de Velocidade"
  # TELEMETRY: "false"
  # ENABLE_ID_OBFUSCATION: "false"
  # REDACT_IP_ADDRESSES: "false"
  # PASSWORD:
  # EMAIL:
  # DISABLE_IPINFO: "false"
  # IPINFO_APIKEY: "your api key"
  # DISTANCE: "km"
  # WEBPORT: 8080

x-metube-env: &metube-env
  DEFAULT_THEME: dark

x-pihole-env: &pihole-env
  # Set a password to access the web interface. Not setting one will result in a random password being assigned
  FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-pihole-pass}
  # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
  FTLCONF_dns_listeningMode: 'all'

x-qbittorrent-env: &qbittorrent-env
  WEBUI_PORT: 8033
  TORRENTING_PORT: 6881

x-stirling-pdf-env: &stirling-pdf-env
  LANGS: pt_BR
  DISABLE_ADDITIONAL_FEATURES: 'true'

x-tapmap-env: &tapmap-env
  TAPMAP_IN_DOCKER: '1' # Set this to '1' if you want to run Tapmap in Docker. It enables some Docker-specific features and optimizations.

x-umami-env: &umami-env
  DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
  DATABASE_TYPE: postgresql
  APP_SECRET: ljVRotlgItt2dHR8TgvXvfKAfvf6AFiydmNfvKx-7oE
  POSTGRES_DB: umami
  POSTGRES_USER: umami
  POSTGRES_PASSWORD: umami

x-vaultwarden-env: &vaultwarden-env
  DOMAIN: "https://vault.local"

x-zabbix-env: &zabbix-env
  DB_SERVER_HOST: zabbix-database
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: zabbix
  POSTGRES_DB: zabbix
  ZBX_SERVER_HOST: zabbix-server
  PHP_TZ: UTC
  ZBX_HOSTNAME: zabbix-agent

services:

  # https://www.audiobookshelf.org/docs#docker-compose-install
  # https://www.audiobookshelf.org/docs#docker-compose-upgrade
  # https://www.audiobookshelf.org/docs#env-configuration
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.34.0@sha256:4143292c530f6ac6700afd13360c04f477e4f1a81c1c97c4224b1c7e4330c5c4
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - /mnt/hd_externo/containers/audiobookshelf/audiobooks:/audiobooks
      - /mnt/hd_externo/containers/audiobookshelf/podcasts:/podcasts
      - /mnt/hd_externo/containers/audiobookshelf/config:/config
      - /mnt/hd_externo/containers/audiobookshelf/metadata:/metadata
    environment:
      <<: *timezone-env
    <<: *restart

  # https://github.com/linuxserver/docker-calibre-web
  # https://github.com/janeczku/calibre-web
  calibre-web:
    image: linuxserver/calibre-web:0.6.26@sha256:8dfec6e631dd6eb432a37f8a638f5a2b6e4a4927ce71e2b26bb82a1bb3a3ff15
    container_name: calibre-web
    environment:
      <<: [*timezone-env, *calibre-web-env, *user-permissions]
    volumes:
      - ${BASE}/calibre-web/config:/config
      - ${BASE}/calibre-web/books:/books
    ports:
      - 8024:8083
    <<: [*local-dns, *restart]

  # https://hub.docker.com/r/cloudflare/cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    <<: [*cloudflare-dns, *restart]
  
  downtify:
    image: ghcr.io/henriquesebastiao/downtify:2.7.0@sha256:95d00787cfcd645ce8e48aead56b6a6b96c6f85646c14d8f7a6491f1a03e0cbc
    container_name: downtify
    ports:
      - 8020:8000
    volumes:
      - ${BASE}/jellyfin/media/downtify:/downloads
      - ${BASE}/downtify/data:/data
    <<: [*cloudflare-dns, *restart]

  # https://dozzle.dev/guide/what-is-dozzle
  # https://github.com/amir20/dozzle
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v10.5.1@sha256:2f8d5c2b6181533a58246313b1d840a69ae04e6c1010e2f6bb52c2228342b443
    environment:
      <<: *user-permissions
    ports:
      - 8005:8080
    <<: [*docker-socket, *local-dns, *restart]
  
  # https://github.com/linuxserver/docker-duplicati
  # https://docs.duplicati.com/
  #
  # Diretórios de backups
  # --------------------------------------------
  # Drive                           -> Home Server
  # --------------------------------------------
  # Backups/duplicati/calibre/      -> $HOME/homelab/containers/calibre-web/
  duplicati:
    image: linuxserver/duplicati:2.3.0@sha256:96527b9d11c1a83af9a7a1a58f944eb468e8fedcb5b9bfe8e205c358825db50e
    container_name: duplicati
    privileged: true
    ports:
      - 8018:8200
    volumes:
      - ${BASE}/duplicati/config:/config
      - /home/hick/backups:/backups
      - /:/source:rw
    environment:
      <<: [*timezone-env, *duplicati-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://filebrowser.org/installation.html
  # https://github.com/filebrowser/filebrowser
  filebrowser:
    image: filebrowser/filebrowser:v2.63.3@sha256:289c5dd677c56662440f26eeb44266ed9746fe563d2e9100f546bff558534d70
    container_name: filebrowser
    user: "0:0"
    ports:
      - 8015:80
    volumes:
      - filebrowser_data:/srv
      - filebrowser_database:/database
      - filebrowser_config:/config
      - /home/hick:/data
      - /mnt/hd_externo:/data/hd
    environment:
      <<: *filebrowser-env
    <<: [*local-dns, *restart]
  
  # https://github.com/FreshRSS/FreshRSS#installation
  # https://freshrss.org/
  freshrss:
    image: freshrss/freshrss:1.28.1@sha256:9100f649f5c946f589f54cdb9be7a65996528f48f691ef90eb262a0e06e5a522
    container_name: freshrss
    ports:
      - 8036:80
    volumes:
      - ${BASE}/freshrss/data:/var/www/FreshRSS/data
      - ${BASE}/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      <<: [*freshrss-env, *timezone-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://github.com/glanceapp/glance
  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.4@sha256:6df86a7e8868d1eda21f35205134b1962c422957e42a0c44d4717c8e8f741b1a
    volumes:
      - ${BASE}/glance/config:/app/config
      - ${BASE}/glance/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8007:8080
    environment:
      <<: *user-permissions
    <<: [*cloudflare-dns, *restart]
    # env_file: ${BASE}/glance/.env
  
  # https://go2rtc.org/
  # https://github.com/AlexxIT/go2rtc
  go2rtc: # HTTP Port: 1984, RSTP Port: 8554, WebRTC Port: 8554
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    container_name: go2rtc
    network_mode: host       # important for WebRTC, HomeKit, UDP cameras
    privileged: true         # only for FFmpeg hardware transcoding
    environment:
      <<: [*timezone-env, *user-permissions]
    volumes:
      - "${BASE}/go2rtc/config:/config"   # folder for go2rtc.yaml file (edit from WebUI)
    <<: [*local-dns, *restart]

  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: grafana
    ports:
      - 8004:3000
    user: '0'
    volumes:
      - ${BASE}/grafana:/var/lib/grafana
    <<: [*cloudflare-dns, *restart]
  
  # https://docs.immich.app/install/docker-compose
  immich:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    volumes:
      - ${BASE}/immich/data:/data # Directory where photos and videos are stored
      - /etc/localtime:/etc/localtime:ro
    environment:
      <<: [*immich-env, *user-permissions]
    ports:
      - 8025:2283
    depends_on:
      - immich-redis
      - immich-db
      - immich-machine-learning
    healthcheck:
      disable: false
    <<: [*local-dns, *restart]

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
    volumes:
      - model-cache:/cache
    environment:
      <<: [*immich-env, *user-permissions]
    healthcheck:
      disable: false
    <<: [*local-dns, *restart]

  immich-redis:
    container_name: immich-redis
    hostname: redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: redis-cli ping || exit 1
    environment:
      <<: [*immich-env, *user-permissions]
    <<: [*restart, *local-dns]

  immich-db:
    container_name: immich-postgres
    hostname: database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:8d292bdb796aa58bbbaa47fe971c8516f6f57d6a47e7172e62754feb6ed4e7b0
    environment:
      <<: [*immich-env, *user-permissions]
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${BASE}/immich-db/db:/var/lib/postgresql/data
    shm_size: 128mb
    <<: [*restart, *local-dns]
  
  # https://jellyfin.org/docs/general/installation/container/
  jellyfin:
    image: jellyfin/jellyfin:10.11.8@sha256:1694ff069f0c9dafb283c36765175606866769f5d72f2ed56b6a0f1be922fc37
    container_name: jellyfin
    network_mode: 'host'
    volumes:
      - ${BASE}/jellyfin/config:/config
      - ${BASE}/jellyfin/cache:/cache
      - type: bind
        source: ${BASE}/jellyfin/media
        target: /media
      - type: bind
        source: /mnt/hd_externo/Videos
        target: /media/hd/Videos
    # Optional - alternative address used for autodiscovery
    environment:
      <<: [*jellyfin-env, *user-permissions]
    <<: [*cloudflare-dns, *restart]
  
  # # https://komo.do/docs/setup/mongo
  komodo-mongo:
    image: mongo:8.2.7@sha256:7abfba0d07c9330373f8173981ea4d09cd8a82cdf0e86ccaf7008848d1d24f62
    container_name: komodo-mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    # ports:
    #   - 27017:27017
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb
    environment:
      <<: [*timezone-env, *komodo-env, *user-permissions]
    <<: [*local-dns, *restart]
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:1.19.5@sha256:a1cceb4f971443b1e9f2a767788f663d0afb6244ee2135f7fe3fd1036af37ade
    container_name: komodo-core
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    depends_on:
      - komodo-mongo
    ports:
      - 9120:9120
    environment:
      <<: [*timezone-env, *komodo-env, *user-permissions]
    volumes:
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${BASE}/komodo/core/backups:/backups
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at 
    ## "https://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    <<: [*local-dns, *restart]
  
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:1.19.5@sha256:bd79cf960ed054fe8e02384322303e462448679b1149dde48bbef151417255b1
    container_name: komodo-periphery
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    environment:
      <<: [*timezone-env, *komodo-env, *user-permissions]
    volumes:
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    <<: [*local-dns, *restart]

  # https://github.com/librespeed/speedtest-go
  librespeed:
    container_name: librespeed
    image: ghcr.io/librespeed/speedtest:latest
    environment:
      <<: [*librespeed-env, *user-permissions]
    ports:
      - 8030:8080 # webport mapping (host:container)
    <<: [*local-dns, *restart]
  
  # https://github.com/alexta69/metube
  metube:
    container_name: metube
    image: ghcr.io/alexta69/metube:2026.04.28@sha256:caf21da7d83a4003b429ef1126e9c1499f36f8401a1f8a7b158f70b94ade8edd
    ports:
      - 8009:8081
    volumes:
      - ${BASE}/metube/downloads:/downloads
    environment:
      <<: [*metube-env, *user-permissions]
    <<: [*local-dns, *restart]
  
  # # https://docs.n8n.io/hosting/installation/docker/
  # n8n:
  #   image: n8nio/n8n:2.19.5@sha256:b1b0c592735e24acd3cc64db83f94ef4efd8e331e47c6883249cc51cc1bea16b
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - 8027:443
  #   environment:
  #     - GENERIC_TIMEZONE=${TIMEZONE}
  #     - TZ=${TIMEZONE}
  #     - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
  #     - N8N_RUNNERS_ENABLED=true
  #     - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
  #     - N8N_HOST=${N8N_HOST}
  #     - N8N_PORT=${N8N_PORT}
  #     - N8N_PROTOCOL=${N8N_PROTOCOL}
  #   volumes:
  #     - ${BASE}/n8n/data:/home/node/.n8n
  
  # https://nginxproxymanager.com/setup/
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.14.0@sha256:2aa69b382a384b676c0d4f1d6f2eac40ecd478fcf7af1cfb3f9f1d3cd0c81e12
    container_name: nginx-proxy-manager
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '8081:81' # Admin Web Port
    volumes:
      - ${BASE}/nginx-proxy-manager/data:/data
      - ${BASE}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    environment:
      <<: [*timezone-env, *user-permissions]
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    <<: [*local-dns, *restart]
  
  # https://docs.pi-hole.net/docker/
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.04.1@sha256:1c32c36b862a12762656b6471c854cebc01fe945639ba3a893611337c2c95e99
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8001:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      #- "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      <<: [*pihole-env, *timezone-env, *user-permissions]
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - 'pihole_data:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      - NET_RAW
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    <<: [*cloudflare-dns, *restart]
  
  # https://github.com/linuxserver/docker-qbittorrent
  qbittorrent:
    image: linuxserver/qbittorrent:5.2.0@sha256:2e0148428b6769e2ee1eb6781246b6fca4b70cd680edfcb16e7113d9d6cb1631
    container_name: qbittorrent
    environment:
      <<: [*timezone-env, *qbittorrent-env, *user-permissions]
    volumes:
      - ${BASE}/qbittorrent/config:/config
      - ${BASE}/qbittorrent/downloads:/downloads #optional
    ports:
      - 8033:8033
      - 6881:6881
      - 6881:6881/udp
    <<: [*local-dns, *restart]
  
  # https://github.com/syncthing/syncthing/blob/main/README-Docker.md
  syncthing:  # TODO
    image: syncthing/syncthing:2.1.0@sha256:7c60eb0ec887696c8684de88aea2dfe39a7391184b29d33c0aad778c99c7683e
    container_name: syncthing
    environment:
      <<: *user-permissions
    volumes:
      - ${BASE}/syncthing:/var/syncthing
    ports:
      - 8032:8384 # Web UI
      - 22000:22000/tcp # TCP file transfers
      - 22000:22000/udp # QUIC file transfers
      - 21027:21027/udp # Receive local discovery broadcasts
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

  # https://docs.stirlingpdf.com/Installation/Docker%20Install
  stirling-pdf:
    image: stirlingtools/stirling-pdf:1.6.0@sha256:1f73a8f898fe269cbbccea3be577064dd87fc4334de349fcc5b1afa1bcebf240
    container_name: stirling-pdf
    ports:
      - 8011:8080
    environment:
      <<: [*stirling-pdf-env, *user-permissions]
    <<: [*local-dns, *restart]
  
  tapmap:
    image: olalie/tapmap:v1.6.3@sha256:7829241c1297d3d38e43cab86e318376f8b1bdfd265be6fb864b9b823c1ede81
    container_name: tapmap
    network_mode: host # 8050
    pid: host
    environment:
      <<: [*tapmap-env, *user-permissions]
    volumes:
      - ${BASE}/tapmap/data:/data
    <<: [*cloudflare-dns, *restart]
  
  # https://docs.umami.is/docs/install
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    container_name: umami
    ports:
      - 8006:3000
    environment:
      <<: [*umami-env, *user-permissions]
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: [*local-dns, *restart]

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    environment:
      <<: [*umami-env, *user-permissions]
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: [*local-dns, *restart]
  
  # https://github.com/louislam/uptime-kuma/wiki
  uptime-kuma:
    image: louislam/uptime-kuma:2.3.2@sha256:9aeb4e51d038047f414309c77a1af553281ca535723cb88907d907269d0a908e
    container_name: uptime-kuma
    volumes:
      - ${BASE}/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8026:3001
    environment:
      <<: *user-permissions
    <<: [*local-dns, *restart]
    
  

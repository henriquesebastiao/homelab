# Este arquivo docker compose configura todos os serviços que utilizo em produção no meu servidor pessoal
# 
# Informações úteis para administração dos containers:
# - Os containers estão dispostos em ordem alfabéticas neste arquivo
# - No início de cada serviço há um ou mais links para a documentação ou tutoriais de como configurar cada serviço

x-cloudflare-dns: &cloudflare-dns
  dns:
    - 1.1.1.1
    - 1.0.0.1

x-local-dns: &local-dns
  dns:
    - 172.16.0.2

x-timezone-env: &timezone-env
  TZ: ${TIMEZONE}

x-user-permissions: &user-permissions
  PUID: 1000
  PGID: 1000

x-restart: &restart
  restart: unless-stopped

x-docker-socket: &docker-socket
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

x-calibre-web-env: &calibre-web-env
  DOCKER_MODS: linuxserver/mods:universal-calibre #optional
  OAUTHLIB_RELAX_TOKEN_SCOPE: 1 #optional

x-duplicati-env: &duplicati-env
  DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI__WEBSERVICE_PASSWORD}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}

x-filebrowser-env: &filebrowser-env
  FB_ROOT: /data
  FB_NOAUTH: true

x-freshrss-env: &freshrss-env
  CRON_MIN: '2,32'
  FRESHRSS_INSTALL: |-
    --api-enabled
    --default-user hick
    --language pt-BR
  FRESHRSS_USER: |-
    --api-password ${FRESHRSS_PASSWORD}
    --email ${FRESHRSS_EMAIL}
    --language pt-BR
    --password ${FRESHRSS_PASSWORD}
    --user ${FRESHRSS_USER}

x-jellyfin-env: &jellyfin-env
  JELLYFIN_PublishedServerUrl: http://server.henriquesebastiao.com:8096

x-librespeed-env: &librespeed-env
  MODE: standalone
  # TITLE: "Teste de Velocidade"
  # TELEMETRY: "false"
  # ENABLE_ID_OBFUSCATION: "false"
  # REDACT_IP_ADDRESSES: "false"
  # PASSWORD:
  # EMAIL:
  # DISABLE_IPINFO: "false"
  # IPINFO_APIKEY: "your api key"
  # DISTANCE: "km"
  # WEBPORT: 8080

x-metube-env: &metube-env
  DEFAULT_THEME: dark

x-pihole-env: &pihole-env
  # Set a password to access the web interface. Not setting one will result in a random password being assigned
  FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-pihole-pass}
  # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
  FTLCONF_dns_listeningMode: 'all'

x-stirling-pdf-env: &stirling-pdf-env
  LANGS: pt_BR
  DISABLE_ADDITIONAL_FEATURES: 'true'

x-umami-env: &umami-env
  DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
  DATABASE_TYPE: postgresql
  APP_SECRET: ${UMAMI_SECRET}
  POSTGRES_DB: umami
  POSTGRES_USER: umami
  POSTGRES_PASSWORD: umami
  HOSTNAME: 0.0.0.0

x-vaultwarden-env: &vaultwarden-env
  DOMAIN: "https://server.henriquesebastiao.com:8019"

x-zabbix-env: &zabbix-env
  DB_SERVER_HOST: zabbix-database
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: zabbix
  POSTGRES_DB: zabbix
  ZBX_SERVER_HOST: zabbix-server
  PHP_TZ: UTC
  ZBX_HOSTNAME: zabbix-agent

services:

  # https://github.com/linuxserver/docker-calibre-web
  # https://github.com/janeczku/calibre-web
  calibre-web:
    image: linuxserver/calibre-web:0.6.27@sha256:80b2a77b5925441c76607619fd406694570a50a0e32c229198dbb39e72da6fed
    container_name: calibre-web
    environment:
      <<: [*timezone-env, *calibre-web-env, *user-permissions]
    volumes:
      - ${BASE}/calibre-web/config:/config
      - ${BASE}/calibre-web/books:/books
    <<: [*local-dns, *restart]

  # https://hub.docker.com/r/cloudflare/cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    <<: [*cloudflare-dns, *restart]
  
  downtify:
    image: ghcr.io/henriquesebastiao/downtify:3.4.0@sha256:6cd5efad47b86b77b5c4eb8930d183ac8d960dd3b0fd31275bbf93256eb78254
    container_name: downtify
    volumes:
      - ${BASE}/jellyfin/media/downtify:/downloads
      - ${BASE}/downtify/data:/data
    <<: [*cloudflare-dns, *restart]

  # https://dozzle.dev/guide/what-is-dozzle
  # https://github.com/amir20/dozzle
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v11.3.0@sha256:a7d69d20891d3dcc82636e24afa4c1c162b41d0673ef798b14f09e6b69accc5a
    environment:
      <<: *user-permissions
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - dozzle_data:/data
    <<: [*local-dns, *restart]
  
  # https://github.com/linuxserver/docker-duplicati
  # https://docs.duplicati.com/
  #
  # Diretórios de backups
  # --------------------------------------------
  # Drive                           -> Home Server
  # --------------------------------------------
  # Backups/duplicati/calibre/      -> $HOME/homelab/containers/calibre-web/
  duplicati:
    image: linuxserver/duplicati:2.4.0@sha256:78883c4ea7a33fd360c8cefe684609deed4ca12cf000ae7612f2f89bbfcb7369
    container_name: duplicati
    privileged: true
    ports:
      - 8018:8200
    volumes:
      - ${BASE}/duplicati/config:/config
      - /home/hick/backups:/backups
      - /:/source:rw
    environment:
      <<: [*timezone-env, *duplicati-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://filebrowser.org/installation.html
  # https://github.com/filebrowser/filebrowser
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    user: "0:0"
    volumes:
      - filebrowser_data:/srv
      - filebrowser_database:/database
      - filebrowser_config:/config
      - /home/hick:/data
    environment:
      <<: *filebrowser-env
    <<: [*local-dns, *restart]
  
  # https://github.com/FreshRSS/FreshRSS#installation
  # https://freshrss.org/
  freshrss:
    image: freshrss/freshrss:1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
    container_name: freshrss
    volumes:
      - ${BASE}/freshrss/data:/var/www/FreshRSS/data
      - ${BASE}/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      <<: [*freshrss-env, *timezone-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://github.com/glanceapp/glance
  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    volumes:
      - ${BASE}/glance/config:/app/config
      - ${BASE}/glance/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      <<: *user-permissions
    <<: [*cloudflare-dns, *restart]
    # env_file: ${BASE}/glance/.env

  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: grafana
    user: '0'
    volumes:
      - ${BASE}/grafana:/var/lib/grafana
    <<: [*cloudflare-dns, *restart]
  
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${BASE}/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      DB_DATA_LOCATION: ${IMMICH_DB_DATA_LOCATION}
      DB_HOSTNAME: ${IMMICH_DB_HOSTNAME}
      REDIS_HOSTNAME: ${IMMICCH_REDIS_HOSTNAME}
    depends_on:
      - immich-redis
      - immich-database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich-machine-learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - immich-model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  immich-database:
    container_name: immich-database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
  
  # https://jellyfin.org/docs/general/installation/container/
  jellyfin:
    image: jellyfin/jellyfin:12.2.20261005-225228@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
    container_name: jellyfin
    network_mode: 'host'
    volumes:
      - ${BASE}/jellyfin/config:/config
      - ${BASE}/jellyfin/cache:/cache
      - type: bind
        source: ${BASE}/jellyfin/media
        target: /media
    # Optional - alternative address used for autodiscovery
    environment:
      <<: [*jellyfin-env, *user-permissions]
    <<: [*cloudflare-dns, *restart]

  # https://github.com/librespeed/speedtest-go
  librespeed:
    container_name: librespeed
    image: ghcr.io/librespeed/speedtest:latest
    environment:
      <<: [*librespeed-env, *user-permissions]
    ports:
      - 8030:8080 # webport mapping (host:container)
    <<: [*local-dns, *restart]
  
  # https://github.com/alexta69/metube
  metube:
    container_name: metube
    image: ghcr.io/alexta69/metube:2026.10.09@sha256:df929ef2453fd75c1f1cbd8dafb309ee03ff18d8705c7c1e01642b1202d4a650
    ports:
      - 8009:8081
    volumes:
      - ${BASE}/metube/downloads:/downloads
    environment:
      <<: [*metube-env, *user-permissions]
    <<: [*local-dns, *restart]

  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    environment:
      <<: [*timezone-env, *user-permissions]
    ports:
      - 4533:4533
    # environment:
    #   # Optional: put your config options customization here. Examples:
    #   # ND_LOGLEVEL: debug
    volumes:
      - ${BASE}/navidrome/data:/data
      - ${BASE}/navidrome/music:/music:ro
    <<: [*local-dns, *restart]
  
  # # https://docs.n8n.io/hosting/installation/docker/
  # n8n:
  #   image: n8nio/n8n:2.19.5@sha256:b1b0c592735e24acd3cc64db83f94ef4efd8e331e47c6883249cc51cc1bea16b
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - 8027:443
  #   environment:
  #     - GENERIC_TIMEZONE=${TIMEZONE}
  #     - TZ=${TIMEZONE}
  #     - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
  #     - N8N_RUNNERS_ENABLED=true
  #     - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
  #     - N8N_HOST=${N8N_HOST}
  #     - N8N_PORT=${N8N_PORT}
  #     - N8N_PROTOCOL=${N8N_PROTOCOL}
  #   volumes:
  #     - ${BASE}/n8n/data:/home/node/.n8n
  
  # https://nginxproxymanager.com/setup/

  nginx:
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    container_name: nginx
    ports:
      - '8001:8001' # Pi-hole
      - '8002:8002' # Immich
      - '8003:8003' # Zabbix
      - '8004:8004' # Grafana
      - '8005:8005' # Dozzle
      - '8006:8006' # Umami
      - '8007:8007' # Glance
      - '8008:8008' # Calibre Web
      - '8010:8010' # File Browser
      - '8019:8019' # Vaultwarden
      - '8020:8020' # Downtify
      - '8036:8036' # FreshRSS
    volumes:
      - ${BASE}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${BASE}/nginx/snippets:/etc/nginx/snippets:ro
      - /home/hick/homelab/letsencrypt:/etc/letsencrypt:ro
    environment:
      <<: [*timezone-env, *user-permissions]
    <<: [*local-dns, *restart]
  
  # https://docs.pi-hole.net/docker/
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      #- "8001:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      #- "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      <<: [*pihole-env, *timezone-env, *user-permissions]
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - 'pihole_data:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      - NET_RAW
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    <<: [*cloudflare-dns, *restart]
  
  # https://github.com/linuxserver/docker-qbittorrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
    container_name: qbittorrent
    environment:
      <<: [*timezone-env, *user-permissions]
      WEBUI_PORT: 8022
      TORRENTING_PORT: 6881
    volumes:
      - qbittorrent-config:/config
      - ${BASE}/qbittorrent/downloads:/downloads #optional
    ports:
      - 8022:8022
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s" #optional
    <<: [*local-dns, *restart]
  
  slskd:
    image: slskd/slskd:0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
    container_name: slskd
    environment:
      SLSKD_REMOTE_CONFIGURATION: true
      <<: [*timezone-env, *user-permissions]
    ports:
      - 5030:5030
      - 5031:5031
      - 50300:50300
    volumes:
      - ${BASE}/slskd/data:/app
    <<: [*local-dns, *restart]
  
  speedtest-tracker:
    image: linuxserver/speedtest-tracker:1.15.0@sha256:3f8a2d06703bde3a6d04dcc8178fcd6251b601ce3b8b52958779d5335b5719d1
    container_name: speedtest-tracker
    ports:
        - 8021:80
    environment:
      DB_CONNECTION: sqlite
      APP_KEY: base64:7MVqhKqatr4m9fsyoYm/WUSE88mWb9qMSA6i+Aa6qpY=
      APP_URL: http://speedtest.local
      APP_TIMEZONE: America/Manaus
      APP_LOCALE: pt-BR
      SPEEDTEST_SERVERS: 33211 # Invinet
      SPEEDTEST_SCHEDULE: 30 * * * * # A cada 30 minutos
      <<: *user-permissions
    volumes:
      - ${BASE}/speedtest/data:/config
      - ${BASE}/speedtest/custom-ssl-keys:/config/keys
    <<: [*local-dns, *restart]

  # https://docs.stirlingpdf.com/Installation/Docker%20Install
  stirling-pdf:
    image: stirlingtools/stirling-pdf:1.6.0@sha256:1f73a8f898fe269cbbccea3be577064dd87fc4334de349fcc5b1afa1bcebf240
    container_name: stirling-pdf
    ports:
      - 8011:8080
    environment:
      <<: [*stirling-pdf-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://docs.umami.is/docs/install
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    container_name: umami
    environment:
      <<: [*umami-env, *user-permissions]
    env_file:
      - .env
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    <<: [*local-dns, *restart]
  
  umami-db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: umami-db
    environment:
      <<: [*umami-env, *user-permissions]
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: [*local-dns, *restart]
  
  # https://github.com/louislam/uptime-kuma/wiki
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    container_name: uptime-kuma
    volumes:
      - ${BASE}/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8026:3001
    environment:
      <<: *user-permissions
    <<: [*local-dns, *restart]
  
  # https://github.com/dani-garcia/vaultwarden
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    environment:
      <<: [*vaultwarden-env, *user-permissions]
    volumes:
      - ${BASE}/vaultwarden/data/:/data/
    <<: [*local-dns, *restart]

  # https://www.zabbix.com/documentation/current/en/manual/installation/containers  
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:7.4.15-alpine@sha256:8c139abe303577c1dc49983f81d272ec832835c370912a681f2695803f342be0
    hostname: zabbix-frontend
    container_name: zabbix-frontend
    environment:
      <<: [*zabbix-env, *user-permissions]
    depends_on:
      - zabbix-server
      - zabbix-database
    <<: [*local-dns, *restart]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4.15-alpine@sha256:777870429c94636f2396fd414a259080d167926552543c31b20ae9d0c9f2847f
    container_name: zabbix-server
    hostname: zabbix-server
    init: true
    environment:
      <<: [*zabbix-env, *user-permissions]
    ports:
      - 10050:10050
    depends_on:
      - zabbix-database
    <<: [*local-dns, *restart]

  zabbix-agent:
    image: zabbix/zabbix-agent2:7.4.15-alpine@sha256:a4641f733827aa13af61bf3ccd3b11f61129b2635726b38ad231ac3c42229a0e
    container_name: zabbix-agent
    hostname: zabbix-agent
    restart: unless-stopped
    init: true
    environment:
      <<: [*zabbix-env, *user-permissions]
    <<: [*local-dns, *restart]

  zabbix-database:

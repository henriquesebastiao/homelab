# Este arquivo docker compose configura todos os serviços que utilizo em produção no meu servidor pessoal
# 
# Informações úteis para administração dos containers:
# - Os containers estão dispostos em ordem alfabéticas neste arquivo
# - No início de cada serviço há um ou mais links para a documentação ou tutoriais de como configurar cada serviço

x-cloudflare-dns: &cloudflare-dns
  dns:
    - 1.1.1.1
    - 1.0.0.1

x-local-dns: &local-dns
  dns:
    - 172.16.0.2

x-timezone-env: &timezone-env
  TZ: ${TIMEZONE}

x-user-permissions: &user-permissions
  PUID: 1000
  PGID: 1000

x-restart: &restart
  restart: unless-stopped

x-docker-socket: &docker-socket
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

x-calibre-web-env: &calibre-web-env
  DOCKER_MODS: linuxserver/mods:universal-calibre #optional
  OAUTHLIB_RELAX_TOKEN_SCOPE: 1 #optional

x-duplicati-env: &duplicati-env
  DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI__WEBSERVICE_PASSWORD}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}

x-filebrowser-env: &filebrowser-env
  FB_ROOT: /data
  FB_NOAUTH: true

x-freshrss-env: &freshrss-env
  CRON_MIN: '2,32'
  FRESHRSS_INSTALL: |-
    --api-enabled
    --default-user hick
    --language pt-BR
  FRESHRSS_USER: |-
    --api-password ${FRESHRSS_PASSWORD}
    --email ${FRESHRSS_EMAIL}
    --language pt-BR
    --password ${FRESHRSS_PASSWORD}
    --user ${FRESHRSS_USER}

x-jellyfin-env: &jellyfin-env
  JELLYFIN_PublishedServerUrl: http://server.henriquesebastiao.com:8096

x-librespeed-env: &librespeed-env
  MODE: standalone
  # TITLE: "Teste de Velocidade"
  # TELEMETRY: "false"
  # ENABLE_ID_OBFUSCATION: "false"
  # REDACT_IP_ADDRESSES: "false"
  # PASSWORD:
  # EMAIL:
  # DISABLE_IPINFO: "false"
  # IPINFO_APIKEY: "your api key"
  # DISTANCE: "km"
  # WEBPORT: 8080

x-metube-env: &metube-env
  DEFAULT_THEME: dark

x-pihole-env: &pihole-env
  # Set a password to access the web interface. Not setting one will result in a random password being assigned
  FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-pihole-pass}
  # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
  FTLCONF_dns_listeningMode: 'all'

x-stirling-pdf-env: &stirling-pdf-env
  LANGS: pt_BR
  DISABLE_ADDITIONAL_FEATURES: 'true'

x-umami-env: &umami-env
  DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
  DATABASE_TYPE: postgresql
  APP_SECRET: ${UMAMI_SECRET}
  POSTGRES_DB: umami
  POSTGRES_USER: umami
  POSTGRES_PASSWORD: umami
  HOSTNAME: 0.0.0.0

x-vaultwarden-env: &vaultwarden-env
  DOMAIN: "https://server.henriquesebastiao.com:8019"

x-zabbix-env: &zabbix-env
  DB_SERVER_HOST: zabbix-database
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: zabbix
  POSTGRES_DB: zabbix
  ZBX_SERVER_HOST: zabbix-server
  PHP_TZ: UTC
  ZBX_HOSTNAME: zabbix-agent

services:

  # https://github.com/linuxserver/docker-calibre-web
  # https://github.com/janeczku/calibre-web
  calibre-web:
    image: linuxserver/calibre-web:0.6.26@sha256:a7277fd8884b3d77e8659a2d82b0974af9812d4c1f4040c98b910da21e764a36
    container_name: calibre-web
    environment:
      <<: [*timezone-env, *calibre-web-env, *user-permissions]
    volumes:
      - ${BASE}/calibre-web/config:/config
      - ${BASE}/calibre-web/books:/books
    ports:
      - 8024:8083
    <<: [*local-dns, *restart]

  # https://hub.docker.com/r/cloudflare/cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    <<: [*cloudflare-dns, *restart]
  
  downtify:
    image: ghcr.io/henriquesebastiao/downtify:3.2.0@sha256:205cb78fedbb47cd38274fdb3abd1839a4f2a5d754cb10cf88e36273e65fb40b
    container_name: downtify
    volumes:
      - ${BASE}/jellyfin/media/downtify:/downloads
      - ${BASE}/downtify/data:/data
    <<: [*cloudflare-dns, *restart]

  # https://dozzle.dev/guide/what-is-dozzle
  # https://github.com/amir20/dozzle
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v11.1.1@sha256:c90494cbc3a9ca959634b89fdb3fdecbcbae1f690d7a567d0d356c6fda1d957c
    environment:
      <<: *user-permissions
    ports:
      - 8005:8080
    <<: [*docker-socket, *local-dns, *restart]
  
  # https://github.com/linuxserver/docker-duplicati
  # https://docs.duplicati.com/
  #
  # Diretórios de backups
  # --------------------------------------------
  # Drive                           -> Home Server
  # --------------------------------------------
  # Backups/duplicati/calibre/      -> $HOME/homelab/containers/calibre-web/
  duplicati:
    image: linuxserver/duplicati:2.4.0@sha256:047b962ff7e235dbada19cadb5c0df55bcd63486ece381b2976b094081dabe61
    container_name: duplicati
    privileged: true
    ports:
      - 8018:8200
    volumes:
      - ${BASE}/duplicati/config:/config
      - /home/hick/backups:/backups
      - /:/source:rw
    environment:
      <<: [*timezone-env, *duplicati-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://filebrowser.org/installation.html
  # https://github.com/filebrowser/filebrowser
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    user: "0:0"
    ports:
      - 8015:80
    volumes:
      - filebrowser_data:/srv
      - filebrowser_database:/database
      - filebrowser_config:/config
      - /home/hick:/data
    environment:
      <<: *filebrowser-env
    <<: [*local-dns, *restart]
  
  # https://github.com/FreshRSS/FreshRSS#installation
  # https://freshrss.org/
  freshrss:
    image: freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    container_name: freshrss
    volumes:
      - ${BASE}/freshrss/data:/var/www/FreshRSS/data
      - ${BASE}/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      <<: [*freshrss-env, *timezone-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://github.com/glanceapp/glance
  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    volumes:
      - ${BASE}/glance/config:/app/config
      - ${BASE}/glance/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      <<: *user-permissions
    <<: [*cloudflare-dns, *restart]
    # env_file: ${BASE}/glance/.env

  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: grafana
    ports:
      - 8004:3000
    user: '0'
    volumes:
      - ${BASE}/grafana:/var/lib/grafana
    <<: [*cloudflare-dns, *restart]
  
  # https://jellyfin.org/docs/general/installation/container/
  jellyfin:
    image: jellyfin/jellyfin:12.1.20260915-010956@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    container_name: jellyfin
    network_mode: 'host'
    volumes:
      - ${BASE}/jellyfin/config:/config
      - ${BASE}/jellyfin/cache:/cache
      - type: bind
        source: ${BASE}/jellyfin/media
        target: /media
    # Optional - alternative address used for autodiscovery
    environment:
      <<: [*jellyfin-env, *user-permissions]
    <<: [*cloudflare-dns, *restart]

  # https://github.com/librespeed/speedtest-go
  librespeed:
    container_name: librespeed
    image: ghcr.io/librespeed/speedtest:latest
    environment:
      <<: [*librespeed-env, *user-permissions]
    ports:
      - 8030:8080 # webport mapping (host:container)
    <<: [*local-dns, *restart]
  
  # https://github.com/alexta69/metube
  metube:
    container_name: metube
    image: ghcr.io/alexta69/metube:2026.09.29@sha256:8e2fe9beeefc55a02f6e1d04cad0fc3c22e8f067d309188f016551dc99ec27b3
    ports:
      - 8009:8081
    volumes:
      - ${BASE}/metube/downloads:/downloads
    environment:
      <<: [*metube-env, *user-permissions]
    <<: [*local-dns, *restart]

  navidrome:
    image: deluan/navidrome:0.64.0@sha256:a384948b81bd1529986c5960169e7fc4fa00f46bde6bd517971a4c36671db2af
    container_name: navidrome
    environment:
      <<: [*timezone-env, *user-permissions]
    ports:
      - 4533:4533
    # environment:
    #   # Optional: put your config options customization here. Examples:
    #   # ND_LOGLEVEL: debug
    volumes:
      - ${BASE}/navidrome/data:/data
      - ${BASE}/navidrome/music:/music:ro
    <<: [*local-dns, *restart]
  
  # # https://docs.n8n.io/hosting/installation/docker/
  # n8n:
  #   image: n8nio/n8n:2.19.5@sha256:b1b0c592735e24acd3cc64db83f94ef4efd8e331e47c6883249cc51cc1bea16b
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - 8027:443
  #   environment:
  #     - GENERIC_TIMEZONE=${TIMEZONE}
  #     - TZ=${TIMEZONE}
  #     - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
  #     - N8N_RUNNERS_ENABLED=true
  #     - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
  #     - N8N_HOST=${N8N_HOST}
  #     - N8N_PORT=${N8N_PORT}
  #     - N8N_PROTOCOL=${N8N_PROTOCOL}
  #   volumes:
  #     - ${BASE}/n8n/data:/home/node/.n8n
  
  # https://nginxproxymanager.com/setup/

  nginx:
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    container_name: nginx
    ports:
      - '8006:8006' # Umami
      - '8001:8001' # Pi-hole
      - '8007:8007' # Glance
      - '8019:8019' # Vaultwarden
      - '8020:8020' # Downtify
      - '8036:8036' # FreshRSS
    volumes:
      - ${BASE}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${BASE}/nginx/snippets:/etc/nginx/snippets:ro
      - /home/hick/homelab/letsencrypt:/etc/letsencrypt:ro
    environment:
      <<: [*timezone-env, *user-permissions]
    <<: [*local-dns, *restart]
  
  # https://docs.pi-hole.net/docker/
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      #- "8001:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      #- "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      <<: [*pihole-env, *timezone-env, *user-permissions]
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - 'pihole_data:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      - NET_RAW
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    <<: [*cloudflare-dns, *restart]
  
  # https://github.com/linuxserver/docker-qbittorrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
    container_name: qbittorrent
    environment:
      <<: [*timezone-env, *user-permissions]
      WEBUI_PORT: 8022
      TORRENTING_PORT: 6881
    volumes:
      - qbittorrent-config:/config
      - ${BASE}/qbittorrent/downloads:/downloads #optional
    ports:
      - 8022:8022
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s" #optional
    <<: [*local-dns, *restart]
  
  slskd:
    image: slskd/slskd:0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
    container_name: slskd
    environment:
      SLSKD_REMOTE_CONFIGURATION: true
      <<: [*timezone-env, *user-permissions]
    ports:
      - 5030:5030
      - 5031:5031
      - 50300:50300
    volumes:
      - ${BASE}/slskd/data:/app
    <<: [*local-dns, *restart]
  
  speedtest-tracker:
    image: linuxserver/speedtest-tracker:1.15.0@sha256:dc439a8bbadd3d0d4a4af4ee64bf30a6db9ced425c00ac12ea2ff04e15669ed1
    container_name: speedtest-tracker
    ports:
        - 8021:80
    environment:
      DB_CONNECTION: sqlite
      APP_KEY: base64:7MVqhKqatr4m9fsyoYm/WUSE88mWb9qMSA6i+Aa6qpY=
      APP_URL: http://speedtest.local
      APP_TIMEZONE: America/Manaus
      APP_LOCALE: pt-BR
      SPEEDTEST_SERVERS: 33211 # Invinet
      SPEEDTEST_SCHEDULE: 30 * * * * # A cada 30 minutos
      <<: *user-permissions
    volumes:
      - ${BASE}/speedtest/data:/config
      - ${BASE}/speedtest/custom-ssl-keys:/config/keys
    <<: [*local-dns, *restart]

  # https://docs.stirlingpdf.com/Installation/Docker%20Install
  stirling-pdf:
    image: stirlingtools/stirling-pdf:1.6.0@sha256:1f73a8f898fe269cbbccea3be577064dd87fc4334de349fcc5b1afa1bcebf240
    container_name: stirling-pdf
    ports:
      - 8011:8080
    environment:
      <<: [*stirling-pdf-env, *user-permissions]
    <<: [*local-dns, *restart]

  # https://docs.umami.is/docs/install
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    container_name: umami
    environment:
      <<: [*umami-env, *user-permissions]
    env_file:
      - .env
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    <<: [*local-dns, *restart]
  
  umami-db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: umami-db
    environment:
      <<: [*umami-env, *user-permissions]
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: [*local-dns, *restart]
  
  # https://github.com/louislam/uptime-kuma/wiki
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    container_name: uptime-kuma
    volumes:
      - ${BASE}/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8026:3001
    environment:
      <<: *user-permissions
    <<: [*local-dns, *restart]
    
  
  vagas-dev-api:
    image: ghcr.io/henriquesebastiao/vagas-dev/api:0.2.4@sha256:3d7e7c1cca935fa5050ead5367327a5123d863849bbe2d03697ce34273626dac
    container_name: vagas-dev-api
    restart: always
    env_file:
      - ${BASE}/vagas-dev/.env
    depends_on:
      vagas-dev-db:
        condition: service_healthy
  
  vagas-dev-db:
    container_name: vagas-dev-db
    image: postgres:18.3-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    ports:
      - 8016:5432
    volumes:
      - pgdata-vagas-dev:/var/lib/postgresql/data
    env_file:
      - ${BASE}/vagas-dev/.env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VAGAS_DEV_POSTGRES_USER} -d ${VAGAS_DEV_POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  vagas-dev-web:
    container_name: vagas-dev-web
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    restart: always
    volumes:
      - ${BASE}/vagas-dev/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 8017:80
    environment:
      - NGINX_PORT=80
    depends_on:
      - vagas-dev-api
  
  # https://github.com/dani-garcia/vaultwarden
  vaultwarden:
    image: vaultwarden/server:1.37.3@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
    container_name: vaultwarden
    environment:
      <<: [*vaultwarden-env, *user-permissions]
    volumes:
      - ${BASE}/vaultwarden/data/:/data/
    <<: [*local-dns, *restart]

  # https://www.zabbix.com/documentation/current/en/manual/installation/containers  
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:7.4.11-alpine@sha256:5f579fce86811007404d7224dc8d52a361542b333a60859f83db2844ee9e680c
    hostname: zabbix-frontend
    container_name: zabbix-frontend
    environment:
      <<: [*zabbix-env, *user-permissions]
    ports:
      - 8003:8080
    depends_on:
      - zabbix-server
      - zabbix-database
    <<: [*local-dns, *restart]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4.15-alpine@sha256:777870429c94636f2396fd414a259080d167926552543c31b20ae9d0c9f2847f
    container_name: zabbix-server
    hostname: zabbix-server
    init: true
    environment:
      <<: [*zabbix-env, *user-permissions]
    ports:
      - 10050:10050
    depends_on:
      - zabbix-database
    <<: [*local-dns, *restart]

  zabbix-agent:
    image: zabbix/zabbix-agent2:7.4.15-alpine@sha256:a4641f733827aa13af61bf3ccd3b11f61129b2635726b38ad231ac3c42229a0e
    container_name: zabbix-agent
    hostname: zabbix-agent
    restart: unless-stopped
    init: true
    environment:
      <<: [*zabbix-env, *user-permissions]
    <<: [*local-dns, *restart]

  zabbix-database:
    image: postgres:13.18-alpine3.20@sha256:77815c1f18ae761b0e503503a494475a03149d7ce544934ccecdbafdb3956c94
    container_name: zabbix-database
    hostname: zabbix-database
    environment:
      <<: [*zabbix-env, *user-permissions]      
    volumes:
      - ${BASE}/zabbix/data:/var/lib/postgresql/data
    <<: [*local-dns, *restart]

volumes:
  filebrowser_data:
  filebrowser_database:
  filebrowser_config:
  model-cache:
  pihole_data:
  pgdata-vagas-dev:
  qbittorrent-config:
  umami-db-data:

  # https://github.com/dani-garcia/vaultwarden
  vaultwarden:
    image: vaultwarden/server:1.36.0@sha256:d626d04934cd1192ad8ced1adb975099fca78cec33ab467d2d3c923cde7f3b0c
    container_name: vaultwarden
    environment:
      <<: [*vaultwarden-env, *user-permissions]
    volumes:
      - ${BASE}/vaultwarden/data/:/data/
    ports:
      - 8019:80
    <<: [*local-dns, *restart]

  # https://www.zabbix.com/documentation/current/en/manual/installation/containers  
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:7.4.10-alpine@sha256:b810d84400c4527473226f0ccdb7c29eee9397cabfaa220a8ed9135bd110e530
    hostname: zabbix-frontend
    container_name: zabbix-frontend
    environment:
      <<: [*zabbix-env, *user-permissions]
    ports:
      - 8003:8080
    depends_on:
      - zabbix-server
      - zabbix-database
    <<: [*local-dns, *restart]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4.10-alpine@sha256:944ac5ae2f58c643af43133a4c43e44fba856893e32ddcc73ee7ac1abab9c158
    container_name: zabbix-server
    hostname: zabbix-server
    init: true
    environment:
      <<: [*zabbix-env, *user-permissions]
    ports:
      - 10050:10050
    depends_on:
      - zabbix-database
    <<: [*local-dns, *restart]

  zabbix-agent:
    image: zabbix/zabbix-agent2:7.4.10-alpine@sha256:dc9a2ae2bebf401e8a5bac047e6b3f1f3b4566207101c9df6510be48b9fbda29
    container_name: zabbix-agent
    hostname: zabbix-agent
    restart: unless-stopped
    init: true
    environment:
      <<: [*zabbix-env, *user-permissions]
    <<: [*local-dns, *restart]

  zabbix-database:
    image: postgres:13.18-alpine3.20@sha256:77815c1f18ae761b0e503503a494475a03149d7ce544934ccecdbafdb3956c94
    container_name: zabbix-database
    hostname: zabbix-database
    environment:
      <<: [*zabbix-env, *user-permissions]      
    volumes:
      - ${BASE}/zabbix/data:/var/lib/postgresql/data
    <<: [*local-dns, *restart]


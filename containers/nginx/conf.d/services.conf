server {
    listen 8001 ssl;
    listen [::]:8001 ssl;
    server_name server.henriquesebastiao.com;
    include /etc/nginx/snippets/tls.conf;
    location / {
        set $upstream http://pihole:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 8002 ssl;
    listen [::]:8002 ssl;
    server_name server.henriquesebastiao.com;
    include /etc/nginx/snippets/tls.conf;

    # permite uploads grandes (vídeos inclusive)
    client_max_body_size 50000M;

    # envia o upload direto pro Immich em vez de bufferizar tudo no nginx
    proxy_request_buffering off;
    client_body_buffer_size 1024k;

    # timeouts maiores para uploads/vídeos longos
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;

    location / {
        set $upstream http://immich-server:2283;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}


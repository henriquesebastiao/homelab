server {
    listen 8013 ssl;
    listen [::]:8013 ssl;
    server_name server.henriquesebastiao.com;
    include /etc/nginx/snippets/tls.conf;

    # Uploads grandes (fotos, vídeos)
    client_max_body_size 10240M;
    proxy_request_buffering off;
    client_body_buffer_size 1024k;

    # Timeouts maiores para uploads/downloads longos
    # 3610s = NEXTCLOUD_MAX_TIME (3600) + 10s de margem para o Nextcloud sair antes do Nginx
    proxy_read_timeout 3610s;
    proxy_send_timeout 3610s;
    send_timeout       3610s;

    location / {
        # O container nextcloud-aio-apache é gerenciado pelo AIO e não está na rede do Compose.
        # Com APACHE_IP_BINDING=0.0.0.0 ele escuta na porta 11000 do bridge Docker (172.17.0.1).
        # IP fixo em vez de hostname para evitar resolução via Pi-hole, que não conhece hosts do Docker.
        proxy_pass http://172.17.0.1:11000;
        proxy_set_header X-Forwarded-Host $http_host;
        include /etc/nginx/snippets/proxy.conf;
    }
}

